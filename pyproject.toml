[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langlens"
version = "2.0.0"
description = "Fast, offline language detection for 60+ languages — with translation, a CLI, a quiz and a web app."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Sravanthi Panga" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
translate = ["deep-translator>=1.11"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
langlens = "langlens.cli:main"

[tool.setuptools.packages.find]
include = ["langlens*"]

[tool.setuptools.package-data]
langlens = ["static/*.html"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
